# Gold digging game, hosted from this laptop.
# Connect as this player name to administer the world.
name = ondra
server_name = Gold Digging - micro:bit
server_description = Gold digging game with micro:bit score display
motd = Vytěž co nejvíc zlata! Pořadí: /gold_score
server_announce = false
bind_address = 0.0.0.0
port = 30002
max_users = 8
default_privs = interact,shout
# Passwords are optional for this family server.
default_password =
disallow_empty_password = false
enable_damage = false
creative_mode = false
enable_pvp = false
mg_name = singlenode
mapgen_limit = 128
static_spawnpoint = -16,1,0
time_speed = 0
mcl_enable_hunger = false
mobs_spawn = false
only_peaceful_mobs = true
mcl_doWeatherCycle = false
# Lets edu_gold write to the micro:bit serial port picked by prestart.sh.
secure.trusted_mods = edu_gold
edu_gold_radio_group = 7
